<svg width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="128" cy="128" r="128" fill="url(#bgGradient)"/>
  
  <!-- Person silhouette -->
  <circle cx="128" cy="100" r="35" fill="white" opacity="0.9"/>
  
  <!-- Body -->
  <ellipse cx="128" cy="200" rx="60" ry="80" fill="white" opacity="0.9"/>
  
  <!-- Name text -->
  <text x="128" y="240" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Suresh Nayak</text>
</svg>
